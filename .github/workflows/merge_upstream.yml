name: Merge Upstream

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Download the script
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tools/changelog/changelog_utils.py
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tools/merge-upstream/merge_upstream.py
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tools/merge-upstream/translation_context.txt

      - name: Run the script
        env:
          GITHUB_TOKEN: ${{ secrets.MERGE_UPSTREAM_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_BRANCH: "master"
          UPSTREAM_REPO: "tgstation/tgstation"
          UPSTREAM_BRANCH: "master"
          MERGE_BRANCH: "merge-upstream"
          CHANGELOG_AUTHOR: "tgstation"
          TRANSLATE_CHANGES: "true"
          TRANSLATE_API_BASE_URL: ${{ vars.TRANSLATE_API_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'gemini-3.6-flash' }}
          LOG_LEVEL: ${{ runner.debug && 'DEBUG' || 'INFO' }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo "::error::Set MERGE_UPSTREAM_TOKEN with Contents, Pull requests, and Workflows write permissions"; exit 1; }
          test -n "$TRANSLATE_API_KEY" || { echo "::error::Set TRANSLATE_API_KEY for the translation provider"; exit 1; }
          git config --global user.email "action@github.com"
          git config --global user.name "Upstream Sync"
          python3 -u merge_upstream.py
